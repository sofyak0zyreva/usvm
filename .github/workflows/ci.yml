name: CI

on:
  push:
    branches: [ "non-aliasing-fix" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  JAVA: 11
  JAVA_DISTRIBUTION: zulu

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run non-aliasing tests
        run: ./gradlew :usvm-jvm:test --tests "org.usvm.samples.nonAliasing.*"

      - name: Upload test reports
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: non-aliasing-test-reports
          path: '**/build/reports/'
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to find which files this branch changed compared to main

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check formatting of changed files
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: ./scripts/format-changed.sh --check
